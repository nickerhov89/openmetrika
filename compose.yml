services:
  openmetrika:
    build: .
    ports:
      - "127.0.0.1:${OPENMETRIKA_PORT:-3015}:3015"
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3015}
      AMO_CLIENT_ID: ${AMO_CLIENT_ID:-}
      AMO_CLIENT_SECRET: ${AMO_CLIENT_SECRET:-}
      AMO_REDIRECT_URI: ${AMO_REDIRECT_URI:-}
      AMO_TOKEN_ENCRYPTION_KEY: ${AMO_TOKEN_ENCRYPTION_KEY:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-180}
      REPLAY_RETENTION_DAYS: ${REPLAY_RETENTION_DAYS:-30}
    volumes:
      - analytics_data:/app/data
      - analytics_backups:/app/backups
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 100
volumes:
  analytics_data:
  analytics_backups:
